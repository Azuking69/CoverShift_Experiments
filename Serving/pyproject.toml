[project]
name = "covershift-exp"
version = "0.1"
description = "CoverShift 実験用（Agent Server のDocker版が、この形を必要とする）"
requires-python = ">=3.10"
dependencies = ["ortools", "anthropic"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["core"]