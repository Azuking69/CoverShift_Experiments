# V0（基準）：LangGraphのOSS部品 PostgresSaver ＋ PostgreSQL だけ。Agent Serverは使わない（ライセンス不要）。
services:
  v0-postgres:
    image: postgres:16
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: v0
      POSTGRES_USER: covershift
      POSTGRES_PASSWORD: covershift
    volumes:
      - v0-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U covershift -d v0"]
      interval: 3s
      timeout: 3s
      retries: 10
volumes:
  v0-data:
